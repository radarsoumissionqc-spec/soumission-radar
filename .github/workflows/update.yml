name: Actualiser les appels d'offres SEAO
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importer les avis publics
        run: python scripts/update_seao.py
      - name: Publier les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunities.json
          git diff --cached --quiet || (git commit -m "Actualisation des appels d'offres" && git push)
